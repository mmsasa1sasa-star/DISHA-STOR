<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | DISHA STOR</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #16161f;
            --fg-primary: #fafafa;
            --fg-secondary: #a3a3a3;
            --fg-muted: #737373;
            
            --cat-featured: #f59e0b;
            --cat-featured-bg: rgba(245, 158, 11, 0.1);
            --cat-featured-border: rgba(245, 158, 11, 0.3);
            
            --cat-accessories: #ec4899;
            --cat-accessories-bg: rgba(236, 72, 153, 0.1);
            --cat-accessories-border: rgba(236, 72, 153, 0.3);
            
            --cat-decor: #06b6d4;
            --cat-decor-bg: rgba(6, 182, 212, 0.1);
            --cat-decor-border: rgba(6, 182, 212, 0.3);
            
            --cat-tech: #8b5cf6;
            --cat-tech-bg: rgba(139, 92, 246, 0.1);
            --cat-tech-border: rgba(139, 92, 246, 0.3);
            
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 22px;
            --radius-xl: 32px;
        }

        [data-theme="light"] {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --fg-primary: #1a1a1a;
            --fg-secondary: #525252;
            --fg-muted: #8a8a8a;
            --glass-bg: rgba(0, 0, 0, 0.02);
            --glass-border: rgba(0, 0, 0, 0.08);
            
            --cat-featured-bg: rgba(245, 158, 11, 0.08);
            --cat-accessories-bg: rgba(236, 72, 153, 0.08);
            --cat-decor-bg: rgba(6, 182, 212, 0.08);
            --cat-tech-bg: rgba(139, 92, 246, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
            max-width: 100vw;
        }

        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background: var(--bg-primary);
            color: var(--fg-primary);
            overflow-x: hidden;
            min-height: 100vh;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* ============================================
           BACKGROUND
        ============================================ */
        .bg-container {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .bg-gradient {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 100% 80% at 50% -20%, rgba(245, 158, 11, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse 80% 60% at 100% 20%, rgba(236, 72, 153, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 50% at 0% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse 40% 40% at 80% 90%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                var(--bg-primary);
        }

        [data-theme="light"] .bg-gradient {
            background: 
                radial-gradient(ellipse 100% 80% at 50% -20%, rgba(245, 158, 11, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse 80% 60% at 100% 20%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse 60% 50% at 0% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
                var(--bg-primary);
        }

        .grid-pattern {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 20%, transparent 70%);
        }

        [data-theme="light"] .grid-pattern {
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
        }

        /* Floating Shapes */
        .shapes-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
            animation: float-shape 20s infinite ease-in-out;
        }

        .floating-shape:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            background: radial-gradient(circle, var(--cat-featured-bg) 0%, transparent 70%);
            animation-delay: 0s;
        }

        .floating-shape:nth-child(2) {
            width: 250px;
            height: 250px;
            bottom: -80px;
            right: -80px;
            background: radial-gradient(circle, var(--cat-accessories-bg) 0%, transparent 70%);
            animation-delay: -5s;
        }

        .floating-shape:nth-child(3) {
            width: 200px;
            height: 200px;
            top: 50%;
            right: 10%;
            background: radial-gradient(circle, var(--cat-decor-bg) 0%, transparent 70%);
            animation-delay: -10s;
        }

        .floating-shape:nth-child(4) {
            width: 150px;
            height: 150px;
            top: 30%;
            left: 5%;
            background: radial-gradient(circle, var(--cat-tech-bg) 0%, transparent 70%);
            animation-delay: -15s;
        }

        @keyframes float-shape {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.9); }
            75% { transform: translate(20px, 10px) scale(1.05); }
        }

        /* ============================================
           PARTICLES
        ============================================ */
        .particles-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            opacity: 0;
            animation: particle-rise 15s infinite ease-in-out;
        }

        @keyframes particle-rise {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 0.7;
                transform: translateY(80vh) scale(1);
            }
            90% {
                opacity: 0.7;
                transform: translateY(10vh) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-10vh) scale(0);
            }
        }

        /* ============================================
           MAIN CONTAINER
        ============================================ */
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        /* ============================================
           404 DISPLAY
        ============================================ */
        .error-content {
            text-align: center;
            z-index: 10;
            max-width: 600px;
        }

        .error-illustration {
            position: relative;
            margin-bottom: 40px;
        }

        .error-code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(8rem, 25vw, 16rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--cat-featured) 0%, var(--cat-accessories) 50%, var(--cat-decor) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: gradient-shift 5s ease infinite;
            position: relative;
            display: inline-block;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .error-glitch {
            position: absolute;
            inset: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(8rem, 25vw, 16rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--cat-accessories) 0%, var(--cat-decor) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% { opacity: 0; transform: translate(0); }
            92% { opacity: 0.8; transform: translate(-5px, 2px); }
            94% { opacity: 0; transform: translate(5px, -2px); }
            96% { opacity: 0.6; transform: translate(2px, 5px); }
            98% { opacity: 0; transform: translate(-2px, -5px); }
        }

        /* Floating Elements Around 404 */
        .floating-icons {
            position: absolute;
            inset: -50px;
            pointer-events: none;
        }

        .floating-icon {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: icon-float 6s infinite ease-in-out;
        }

        .floating-icon.orange {
            background: var(--cat-featured-bg);
            border: 1px solid var(--cat-featured-border);
            color: var(--cat-featured);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-icon.pink {
            background: var(--cat-accessories-bg);
            border: 1px solid var(--cat-accessories-border);
            color: var(--cat-accessories);
            top: 20%;
            right: 5%;
            animation-delay: -1.5s;
        }

        .floating-icon.cyan {
            background: var(--cat-decor-bg);
            border: 1px solid var(--cat-decor-border);
            color: var(--cat-decor);
            bottom: 15%;
            left: 5%;
            animation-delay: -3s;
        }

        .floating-icon.purple {
            background: var(--cat-tech-bg);
            border: 1px solid var(--cat-tech-border);
            color: var(--cat-tech);
            bottom: 10%;
            right: 10%;
            animation-delay: -4.5s;
        }

        @keyframes icon-float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        /* ============================================
           TEXT CONTENT
        ============================================ */
        .error-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 16px;
        }

        .error-description {
            font-size: 1.1rem;
            color: var(--fg-secondary);
            line-height: 1.8;
            margin-bottom: 40px;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ============================================
           BUTTONS
        ============================================ */
        .error-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-bottom: 60px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 36px;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: #0c0c0c;
            background: linear-gradient(135deg, var(--cat-featured) 0%, var(--cat-accessories) 100%);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 48px rgba(245, 158, 11, 0.35);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px 32px;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--fg-primary);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--fg-muted);
            transform: translateY(-2px);
        }

        /* ============================================
           SEARCH SUGGESTIONS
        ============================================ */
        .suggestions {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            max-width: 400px;
            margin: 0 auto;
        }

        .suggestions-title {
            font-size: 0.9rem;
            color: var(--fg-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .suggestions-title svg {
            color: var(--cat-featured);
        }

        .suggestions-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .suggestion-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--glass-bg);
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            color: var(--fg-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .suggestion-link:hover {
            background: var(--cat-featured-bg);
            border-color: var(--cat-featured-border);
            color: var(--cat-featured);
            transform: translateX(-5px);
        }

        .suggestion-link svg {
            flex-shrink: 0;
        }

        /* ============================================
           HEADER
        ============================================ */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        nav {
            margin: 16px;
            padding: 16px 24px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            transition: all 0.3s ease;
        }

        [data-theme="light"] nav {
            background: rgba(255, 255, 255, 0.85);
        }

        .nav-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--cat-featured), var(--cat-accessories));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--fg-primary);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle {
            width: 56px;
            height: 30px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .theme-toggle-track {
            position: absolute;
            inset: 3px;
            border-radius: 100px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            transition: all 0.4s ease;
        }

        [data-theme="light"] .theme-toggle-track {
            background: linear-gradient(135deg, #87ceeb 0%, #f0e68c 100%);
        }

        .theme-toggle-thumb {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--fg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        [data-theme="light"] .theme-toggle-thumb {
            right: calc(100% - 27px);
            background: #ffa500;
        }

        .theme-toggle-thumb svg {
            width: 14px;
            height: 14px;
        }

        .moon-icon { color: #6366f1; }
        .sun-icon { color: #fff; display: none; }

        [data-theme="light"] .moon-icon { display: none; }
        [data-theme="light"] .sun-icon { display: block; }

        /* ============================================
           ANIMATED ROBOT/CHARACTER
        ============================================ */
        .character-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
        }

        .character {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: character-bounce 2s infinite ease-in-out;
        }

        @keyframes character-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .character-head {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--cat-featured-bg), var(--cat-tech-bg));
            border: 2px solid var(--cat-featured-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .character-eyes {
            display: flex;
            gap: 12px;
        }

        .character-eye {
            width: 10px;
            height: 10px;
            background: var(--cat-featured);
            border-radius: 50%;
            animation: blink 3s infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .character-body {
            width: 40px;
            height: 30px;
            background: var(--cat-accessories-bg);
            border: 1px solid var(--cat-accessories-border);
            border-radius: 0 0 20px 20px;
            margin-top: -5px;
        }

        .character-shadow {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            filter: blur(5px);
            animation: shadow-pulse 2s infinite ease-in-out;
        }

        @keyframes shadow-pulse {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.3; }
            50% { transform: translateX(-50%) scale(0.8); opacity: 0.2; }
        }

        /* ============================================
           SCROLL REVEAL
        ============================================ */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.2s; }
        .reveal-delay-3 { transition-delay: 0.3s; }
        .reveal-delay-4 { transition-delay: 0.4s; }

        /* ============================================
           REDUCED MOTION
        ============================================ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="bg-container">
        <div class="bg-gradient"></div>
        <div class="grid-pattern"></div>
        <div class="shapes-container">
            <div class="floating-shape"></div>
            <div class="floating-shape"></div>
            <div class="floating-shape"></div>
            <div class="floating-shape"></div>
        </div>
        <div class="particles-container" id="particles"></div>
    </div>

    <!-- Header -->
    <header>
        <nav>
            <div class="nav-content">
                <a href="home.html" class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0c0c0c" stroke-width="2.5">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                    </div>
                    <span class="logo-text">DISHA STOR</span>
                </a>

                <div class="nav-actions">
                    <button class="theme-toggle" id="theme-toggle" aria-label="تبديل الوضع">
                        <div class="theme-toggle-track"></div>
                        <div class="theme-toggle-thumb">
                            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                            </svg>
                            <svg class="sun-icon" viewBox="0 0 24 24" fill="currentColor">
                                <circle cx="12" cy="12" r="5"/>
                            </svg>
                        </div>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="error-container">
        <div class="error-content">
            <!-- Character -->
            <div class="character-container reveal">
                <div class="character">
                    <div class="character-head">
                        <div class="character-eyes">
                            <div class="character-eye"></div>
                            <div class="character-eye"></div>
                        </div>
                    </div>
                    <div class="character-body"></div>
                </div>
                <div class="character-shadow"></div>
            </div>

            <!-- 404 Code -->
            <div class="error-illustration reveal reveal-delay-1">
                <div class="error-code">404</div>
                <div class="error-glitch">404</div>
                
                <div class="floating-icons">
                    <div class="floating-icon orange">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                    </div>
                    <div class="floating-icon pink">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </div>
                    <div class="floating-icon cyan">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>

    <script>
        // ============================================
        // UTILITIES
        // ============================================
        function $(selector) { return document.querySelector(selector); }
        function $$(selector) { return document.querySelectorAll(selector); }

        // ============================================
        // THEME
        // ============================================
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);

            $$('.theme-toggle').forEach(toggle => {
                toggle.addEventListener('click', () => {
                    const currentTheme = document.documentElement.getAttribute('data-theme');
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                });
            });
        }

        // ============================================
        // PARTICLES
        // ============================================
        function initParticles() {
            const container = $('#particles');
            const colors = ['#f59e0b', '#ec4899', '#06b6d4', '#8b5cf6'];
            
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (12 + Math.random() * 8) + 's';
                container.appendChild(particle);
            }
        }

        // ============================================
        // SCROLL REVEAL
        // ============================================
        function initScrollReveal() {
            const revealElements = $$('.reveal');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

            revealElements.forEach(el => observer.observe(el));
        }

        // ============================================
        // INIT
        // ============================================
        function init() {
            initTheme();
            initParticles();
            initScrollReveal();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
